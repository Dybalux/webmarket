# pytest.ini — webmarket test configuration
# Loaded automatically by pytest from the project root.

[pytest]
# pytest-asyncio: run all async tests without explicit @pytest.mark.asyncio
asyncio_mode = auto

# Where pytest looks for tests
testpaths = tests

# Add project root and ./tests to sys.path so `import routers`, `import stock_helpers`,
# etc. works from any test file without manual sys.path manipulation.
pythonpath = . tests

# Registered markers — must be declared or pytest -W error::pytest.PytestUnknownMarkWarning
# will fire when tests use them.
markers =
    unit: fast, isolated unit tests (no DB, no network)
    integration: tests that exercise the router layer against an in-memory MongoDB
    endpoint: HTTP-level tests that hit the FastAPI TestClient
    xfail_bug: test that exercises a known production bug — see fix-stock-bugs change

# Default options: fail on unknown markers so typos in @pytest.mark.* are caught early
# Note: --strict-markers is set in addopts below; strict_markers ini key was removed in pytest 8

# Coverage defaults (overridable on the CLI)
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short

[coverage:run]
# Modules we care about measuring coverage on
source =
    routers
    stock_helpers
    models
    database
    pricing_helpers

# Files that should never count against coverage
omit =
    tests/*
    scripts/*
    __pycache__/*
    .venv/*

[coverage:report]
# Baseline for the add-stock-tests change is 0%; future changes MUST raise the bar.
fail_under = 0
show_missing = true
skip_covered = false
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
