name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          # Dummy values for CI — tests use mongomock-motor (in-memory) and
          # never touch a real DB, so these only need to satisfy Pydantic
          # Settings() validation at import time.
          SECRET_KEY: ci-dummy-secret-key-not-used-for-real-auth
          DATABASE_URL: mongodb://localhost:27017/webmarket_ci
          DATABASE_NAME: webmarket_ci
          ENV: test
        run: pytest tests/ -v --tb=short
